services:
  postgres:
    image: postgres:16.3-alpine3.20
    container_name: proyecto_elecciones
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      
  mongo:
      image: mongo:7
      container_name: election_mongo
      restart: unless-stopped
      ports:
        - "27017:27017"
      volumes:
        - mongo_data:/data/db
      environment:
        MONGO_INITDB_DATABASE: ${MONGO_DB}

volumes:
  postgres_data:
    name: proyecto_elecciones_data
  mongo_data:
    name: election_mongo_data